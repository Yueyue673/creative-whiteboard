<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作白板</title><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/theme.css"></head>
<body>
<header id="shellHeader"><nav><button id="openBoards" class="shell-icon" title="内容与白板 · Ctrl+\\" aria-label="展开或收起内容与白板" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><button data-command="search" class="shell-icon" title="搜索全部内容 · Ctrl+K" aria-label="搜索全部内容"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button></nav><span id="shellStatus" aria-live="polite"></span><button data-command="ai" class="shell-ai" title="查资料与参考">AI</button><button id="splitToggle" class="shell-icon" aria-pressed="false" aria-label="左右分栏" title="左右分栏">左右分栏</button><details id="shellMore"><summary aria-label="更多操作" title="更多操作">⋯</summary><div><button data-command="rename">重命名当前白板</button><button data-command="export">导出当前白板</button><button data-command="markdown">导出文字</button><button data-command="settings">外观</button><button data-command="recovery">恢复与历史</button><button data-command="help">使用帮助</button><button id="externalWindow">在独立窗口打开</button></div></details></header>
<main id="workspace" style="--split:50%">
<aside id="globalExplorer" hidden aria-label="内容与白板"></aside>
<div id="tabHeaders"><section class="tab-group" data-side="left"><div class="tabs" role="tablist" aria-label="左侧白板标签"></div><button class="add-tab" data-side="left" title="打开或新建白板" aria-label="左侧打开白板">＋</button></section><section class="tab-group right-group" data-side="right"><div class="tabs" role="tablist" aria-label="右侧白板标签"></div><button class="add-tab" data-side="right" title="打开或新建白板" aria-label="右侧打开白板">＋</button></section></div>
<div id="frameDeck"><div class="empty-pane" data-side="left"><h2>在这里打开白板</h2><p>打开多个标签，再按自己的顺序编排。</p><button class="choose-board" data-side="left">选择白板</button></div><div class="empty-pane right-empty" data-side="right"><h2>右侧放什么？</h2><p>打开另一张白板，或把已有标签拖到这边。</p><button class="choose-board" data-side="right">选择白板</button></div></div>
<div id="splitter" role="separator" tabindex="0" aria-label="调整左右分栏宽度，双击恢复各半" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></div>
<div id="dragGlass"></div><div id="rightDropTarget">放到右侧分栏</div>
</main>
<dialog id="boardPicker"><form method="dialog"><h2>打开白板</h2><button class="dialog-close" aria-label="关闭">×</button></form><input id="boardQuery" type="search" placeholder="搜索白板名称" aria-label="搜索白板"><div id="boardChoices"></div><div class="new-board"><input id="newBoardName" placeholder="新白板名称" aria-label="新白板名称"><button id="createBoard">新建并打开</button></div><p id="pickerHint" hidden></p></dialog>
<div id="tabContext" hidden><button data-tab-action="move">移到另一侧</button><button data-tab-action="close">关闭标签</button></div>
<div id="shellToast" hidden role="status"></div><link rel="stylesheet" href="/refinement.css"><link rel="stylesheet" href="/workspace-shell.css"><script src="/appearance.js"></script><script src="/shell.js"></script><script src="/workspace-shell.js"></script><script src="/board-lifecycle.js"></script><script src="/library-transfer.js"></script>
</body></html>
