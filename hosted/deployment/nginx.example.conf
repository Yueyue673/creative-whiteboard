# Replace the example domain/certificate and validate before operator deployment.
server {
    listen 443 ssl;
    server_name whiteboard.example.invalid;
    ssl_certificate /absolute/path/to/operator/fullchain.pem;
    ssl_certificate_key /absolute/path/to/operator/privkey.pem;
    client_max_body_size 128m;
    # Search/invitation query strings and request headers must not be logged.
    access_log off;
    error_log /dev/null;
    location / {
        proxy_pass http://127.0.0.1:18880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        # One controlled proxy supplies an address; no client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}
