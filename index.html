$('help').onclick=()=>showDialog('<h2>内容属于你，白板只负责摆放</h2><p>双击空白处新建；双击便签编辑。右键拖动画布，左键摆放或框选。拖便签边缘的小圆点连线，右下角可以改变大小。Ctrl+C / V 复制粘贴，Ctrl+D 复制一份，Ctrl+Z 撤销。</p><p>“内容”打开同一张白板的目录。标签由你自己填写，分组由你自己摆。分组依据卡片左上角的位置；拖分组会带着组内内容一起移动。导入只增加内容，不覆盖已有内容。</p><p>支持文字、Markdown、图片、CSV / TSV、旧版白板 JSON 和资料列表。表格可自行修改列名、增删行列，支持从 Excel 粘贴单元格，并导出 CSV。长文会完整保留在编辑区，卡片上只显示预览。视频、音频和大型资料先在“来源”中记录路径；本版暂不提供媒体播放器。</p><p>“文件夹”管理不同白板，可以创建子文件夹、重命名、移动当前白板。文件夹是工具内的目录，结构保存在 data/目录.json；不会搬动媒体原文件。白板内部仍通过分组和标签整理内容。</p><p>内容自动保存到 <b>data/内容</b>，每张白板一个 JSON 文件。这里是最新完整内容，AI可以读取，你也能备份或同步该目录。AI不会自动监听；需要它工作时告诉它这个路径。文件被其他程序修改时，下一次保存会提示冲突。</p><p>不要在其他设备同时修改同一张白板文件。服务器同步的远程冲突仍由你的同步工具处理。本版是本机工具，不会开放到外网。</p>',[['关闭',()=>$('dialog').close()]]);

function tablePreview(n){const cols=n.columns||[],rows=n.rows||[];return '<table class="table-preview"><thead><tr>'+cols.slice(0,4).map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,4).map(r=>'<tr>'+r.slice(0,4).map(c=>'<td>'+esc(c||' ' )+'</td>').join('')+'</tr>').join('')+'</tbody></table><div class="table-count">'+rows.length+' 行 · '+cols.length+' 列 · 双击编辑完整表格</div>'}
function parseDelimited(text,delimiter){text=text.replace(/^\uFEFF/,'');if(!text)return [];const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else if(quoted)quoted=false;else if(!cell)quoted=true;else cell+=c}else if(c===delimiter&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('表格引号没有闭合，请检查 CSV 文件');if(cell||row.length||!/[\r\n]$/.test(text)){row.push(cell);rows.push(row)}return rows}
function tableData(matrix,header){if(!matrix.length)throw Error('表格没有内容');const width=Math.max(...matrix.map(r=>r.length));if(width>100||matrix.length>5001)throw Error('表格最多支持100列、5000行');const fill=r=>Array.from({length:width},(_,i)=>String(r[i]??'')),columns=header?fill(matrix[0]):Array.from({length:width},(_,i)=>'列 '+(i+1)),rows=(header?matrix.slice(1):matrix).map(fill);if(rows.length>5000)throw Error('表格最多5000行');return{columns,rows}}
function addTableFromMatrix(matrix,header){try{addNote(center(),{type:'table',title:'新表格',body:'',w:620,h:360,color:'#ffffff',...tableData(matrix,header)})}catch(e){toast(e.message)}}
function tableMarkdown(n){const cell=s=>String(s).replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>');return '| '+n.columns.map(cell).join(' | ')+' |\n| '+n.columns.map(()=>'---').join(' | ')+' |\n'+n.rows.map(r=>'| '+r.map(cell).join(' | ')+' |').join('\n')}
function exportCSV(n){const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';download('\uFEFF'+[n.columns,...n.rows].map(r=>r.map(quote).join(',')).join('\r\n'),(n.title||'表格')+'.csv','text/csv;charset=utf-8')}
function confirmTableDelete(text,fn){showDialog('<h2>'+esc(text)+'</h2><p>删除后可以用白板的撤销按钮恢复。</p>',[['取消',()=>$('dialog').close()],['删除',()=>{$('dialog').close();fn()}]])}
function mountTableEditor(n){
 const box=document.createElement('section');box.id='tableBox';box.innerHTML='<div class="table-actions"><button id="tableAddRow">＋ 行</button><button id="tableAddColumn">＋ 列</button><button id="tableCSV">导出 CSV</button><button id="tableFirstHeader">首行作为列名</button></div><p class="table-help">点击单元格直接写。可从 Excel 复制一片单元格，粘贴到这里。列名可以修改；CSV 导入时第一行作为列名。</p><div class="table-scroll"><table class="edit-table"><thead><tr><th class="row-number"></th>'+n.columns.map((c,i)=>'<th><button class="col-remove" data-remove-col="'+i+'" title="删除这一列">×</button><input data-column="'+i+'" aria-label="第'+(i+1)+'列名称" value="'+esc(c)+'"></th>').join('')+'</tr></thead><tbody>'+n.rows.map((r,ri)=>'<tr><td class="row-number"><button class="col-remove" data-remove-row="'+ri+'" title="删除第'+(ri+1)+'行">'+(ri+1)+' ×</button></td>'+r.map((c,ci)=>'<td><textarea data-row="'+ri+'" data-col="'+ci+'" aria-label="第'+(ri+1)+'行第'+(ci+1)+'列">'+esc(c)+'</textarea></td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 $('title').after(box);const update=()=>{drawNodes();renderOutline();change()};const rebuild=()=>{update();openEditor(n.id)};
 box.querySelectorAll('[data-column]').forEach(el=>{bindContentInput(el,()=>n.columns[Number(el.dataset.column)],value=>{n.columns[Number(el.dataset.column)]=value;update()})});
 box.querySelectorAll('[data-row]').forEach(el=>{bindContentInput(el,()=>n.rows[Number(el.dataset.row)][Number(el.dataset.col)],value=>{n.rows[Number(el.dataset.row)][Number(el.dataset.col)]=value;update()});el.onpaste=e=>{const text=e.clipboardData.getData('text/plain');if(!text.includes('\t'))return;e.preventDefault();e.stopPropagation();try{const matrix=parseDelimited(text,'\t'),r=Number(el.dataset.row),c=Number(el.dataset.col),width=Math.max(n.columns.length,c+Math.max(...matrix.map(a=>a.length))),height=Math.max(n.rows.length,r+matrix.length);if(width>100||height>5000)throw Error('表格最多100列、5000行');undoPoint();while(n.columns.length<width){n.columns.push('列 '+(n.columns.length+1));for(const row of n.rows)row.push('')}while(n.rows.length<height)n.rows.push(n.columns.map(()=>''));matrix.forEach((row,i)=>row.forEach((cell,j)=>n.rows[r+i][c+j]=cell));rebuild()}catch(err){toast(err.message)}}});
 $('tableAddRow').onclick=()=>{if(n.rows.length>=5000)return toast('最多5000行');undoPoint();n.rows.push(n.columns.map(()=>''));rebuild()};$('tableAddColumn').onclick=()=>{if(n.columns.length>=100)return toast('最多100列');undoPoint();n.columns.push('列 '+(n.columns.length+1));n.rows.forEach(r=>r.push(''));rebuild()};$('tableCSV').onclick=()=>exportCSV(n);$('tableFirstHeader').disabled=!n.rows.length;$('tableFirstHeader').onclick=()=>{undoPoint();n.columns=n.rows.shift();rebuild()};
 box.querySelectorAll('[data-remove-col]').forEach(el=>el.onclick=()=>{if(n.columns.length===1)return toast('至少保留一列');const i=Number(el.dataset.removeCol);confirmTableDelete('删除“'+n.columns[i]+'”这一列？',()=>{undoPoint();n.columns.splice(i,1);n.rows.forEach(r=>r.splice(i,1));rebuild()})});box.querySelectorAll('[data-remove-row]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.removeRow);confirmTableDelete('删除第 '+(i+1)+' 行？',()=>{undoPoint();n.rows.splice(i,1);rebuild()})});
}
async function loadFolders(){const r=await api('/api/folders');folderData=await r.json();folderETag=r.headers.get('ETag');renderFolders()}
async function saveFolders(next){try{const r=await api('/api/folders',{method:'PUT',headers:{'Content-Type':'application/json','If-Match':folderETag},body:JSON.stringify(next)});folderData=next;folderETag=r.headers.get('ETag');renderFolders();return true}catch(e){toast(e.code===409?'目录已被其他窗口修改，请重新打开文件夹后再操作':e.message);return false}}
function folderPath(id){const names=[],seen=new Set();let f=folderData.folders.find(f=>f.id===id);while(f&&!seen.has(f.id)){seen.add(f.id);names.unshift(f.name);f=folderData.folders.find(x=>x.id===f.parent)}return names.join(' / ')}
function renderFolders(){if(!$('folderTree'))return;const q=$('boardSearch').value.trim().toLowerCase();const boardRows=(folder,depth)=>boardList.filter(b=>(b.folder||'')===folder&&(!q||b.name.toLowerCase().includes(q))).map(b=>'<button class="board-row '+(b.id===boardId?'current':'')+'" data-board-open="'+esc(b.id)+'" style="padding-left:'+(12+depth*14)+'px">▤ '+esc(b.name)+'</button>').join('');const walk=(parent,depth,seen=new Set())=>folderData.folders.filter(f=>f.parent===parent&&!seen.has(f.id)).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).map(f=>'<button class="folder-row '+(folderSelected===f.id?'current':'')+'" data-folder="'+esc(f.id)+'" style="padding-left:'+(12+depth*14)+'px">▱ '+esc(f.name)+'</button>'+boardRows(f.id,depth+1)+walk(f.id,depth+1,new Set([...seen,f.id]))).join('');
 $('folderTree').innerHTML='<button class="folder-row '+(!folderSelected?'current':'')+'" data-folder="">全部 / 根目录</button>'+boardRows('',1)+walk('',1)+boardList.filter(b=>b.folder&&!folderData.folders.some(f=>f.id===b.folder)&&(!q||b.name.toLowerCase().includes(q))).map(b=>'<button class="board-row" data-board-open="'+esc(b.id)+'">▤ '+esc(b.name)+'（原文件夹不存在）</button>').join('');
 $('folderTree').querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folderSelected=b.dataset.folder;renderFolders()});$('folderTree').querySelectorAll('[data-board-open]').forEach(b=>b.onclick=()=>switchBoard(b.dataset.boardOpen));
 $('folderControls').innerHTML='<button id="moveBoard">移动当前白板…</button>'+(folderSelected?'<button id="renameFolder">改文件夹名</button><button id="deleteFolder">删除空文件夹</button>':'');$('moveBoard').onclick=chooseBoardFolder;if(folderSelected){$('renameFolder').onclick=()=>{const f=folderData.folders.find(f=>f.id===folderSelected);if(f)askName('文件夹名称',f.name,name=>{const next=clone(folderData);next.folders.find(x=>x.id===f.id).name=name;saveFolders(next)})};$('deleteFolder').onclick=async()=>{await listBoards();if(folderData.folders.some(f=>f.parent===folderSelected)||boardList.some(b=>b.folder===folderSelected))return toast('这个文件夹里还有白板或子文件夹，请先移走');const next={folders:folderData.folders.filter(f=>f.id!==folderSelected)};if(await saveFolders(next)){folderSelected='';renderFolders()}}}
}

async function openInitialBoard(){
 const params=new URLSearchParams(location.search),requested=params.get('board'),generation=loadGeneration;
 if(params.get('explorer')==='1'){
  if(!board){board={format:'creative-board',version:1,name:'',folder:'',nodes:[],edges:[],view:{x:0,y:0,z:1}};boardId=''}
  try{await listBoards()}catch(error){toast('白板列表暂时未能读取：'+error.message)}
  try{await showWorkspaceTab(workspaceTab)}catch(error){toast(error.message)}return;
 }
 loading=true;loadTargetId=requested||'';loadError='';loadErrorCode=0;window.dispatchEvent(new Event('creative-board-loading'));
 try{
  let list=[];try{list=await listBoards()}catch(error){if(!requested)throw error}
  if(generation!==loadGeneration)return;
  const last=requested||sessionStorage.getItem('creative-board-window')||localStorage.getItem('creative-board-last');
  if(requested)await loadBoard(requested);
  else if(list.length)await loadBoard(list.some(item=>item.id===last)?last:list[0].id);
  else await newBoard('我的白板');
 }catch(error){
  if(!loadError&&generation===loadGeneration){loadError=error.message||'读取没有完成，请重试。';loadErrorCode=error.code||0;loading=false;window.dispatchEvent(new Event('creative-board-loading'))}
  $('status').textContent='无法打开 · 可重试';toast(error.message);
 }
}
window.addEventListener('DOMContentLoaded',()=>openInitialBoard());
