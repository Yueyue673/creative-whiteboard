name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check note-editor.js
      - run: node --check canvas-objects.js
      - run: node --check document-paper.js
      - run: node --check workspace.js
      - run: node --check workflow.js
      - run: node --check preview-pan.js
      - run: node --check shell.js
      - run: node --check pane.js
      - run: node --check cells.js
      - run: node --check experience.js
      - run: node --check clipboard-coordinator.js
      - run: node --check library-editing.js
      - run: node --check library-spatial.js
      - run: node --check library-folders.js
      - run: node --check import-session.js
      - run: node --check document-loading.js
      - run: node --check library-transfer.js
      - run: node --check board-lifecycle.js
      - run: node --check recovery.js
      - run: node --check explorer-navigation.js
      - run: node --check library-clipboard.js
      - run: node --check autosize.js
      - run: node --check context-capture.js
      - run: node --check navigation.js
      - run: node --check media-markers.js
      - run: node --check media-controls.js
      - run: node --check workspace-shell.js
      - run: node --check ai-workflow.js
      - run: node --check refinement.js
      - run: node --check appearance.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SUBSET_RESOURCE_PROOF: .ci-proofs/library-subset-resource
          DOCUMENT_TEXT_PROOF: .ci-proofs/document-paragraph-text-resource
          VIDEO_WRITING_PROOF: .ci-proofs/video-writing-reference
          DOCUMENT_TOOL_PROOF: .ci-proofs/document-tool-panels
          DOCUMENT_LIBRARY_PROOF: .ci-proofs/document-library-insert
          DOCUMENT_LIBRARY_GUARD_PROOF: .ci-proofs/document-library-insert-guards
          DOCUMENT_LIBRARY_PIECES_PROOF: .ci-proofs/document-library-pieces
          DOCUMENT_LIBRARY_PIECES_GUARD_PROOF: .ci-proofs/document-library-pieces-guards
          LIBRARY_SPATIAL_PROOF: .ci-proofs/library-spatial-preview
      - name: Keep isolated subset-resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subset-resource-${{ github.run_id }}
          path: |
            .ci-proofs/library-subset-resource/result.json
            .ci-proofs/library-subset-resource/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-paragraph-text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-paragraph-text-${{ github.run_id }}
          path: |
            .ci-proofs/document-paragraph-text-resource/result.json
            .ci-proofs/document-paragraph-text-resource/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated video-writing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-writing-reference-${{ github.run_id }}
          path: |
            .ci-proofs/video-writing-reference/result.json
            .ci-proofs/video-writing-reference/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-tool-panel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-tool-panels-${{ github.run_id }}
          path: |
            .ci-proofs/document-tool-panels/result.json
            .ci-proofs/document-tool-panels/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-library-insert evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-library-insert-${{ github.run_id }}
          path: |
            .ci-proofs/document-library-insert/result.json
            .ci-proofs/document-library-insert/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-library-insert-guards evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-library-insert-guards-${{ github.run_id }}
          path: |
            .ci-proofs/document-library-insert-guards/result.json
            .ci-proofs/document-library-insert-guards/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-library-pieces evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-library-pieces-${{ github.run_id }}
          path: |
            .ci-proofs/document-library-pieces/result.json
            .ci-proofs/document-library-pieces/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-library-pieces-guards evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-library-pieces-guards-${{ github.run_id }}
          path: |
            .ci-proofs/document-library-pieces-guards/result.json
            .ci-proofs/document-library-pieces-guards/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated library-spatial-preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-spatial-preview-${{ github.run_id }}
          path: |
            .ci-proofs/library-spatial-preview/result.json
            .ci-proofs/library-spatial-preview/*.png
          if-no-files-found: ignore
          retention-days: 3
