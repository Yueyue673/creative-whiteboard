name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check note-editor.js
      - run: node --check canvas-objects.js
      - run: node --check document-paper.js
      - run: node --check workspace.js
      - run: node --check workflow.js
      - run: node --check preview-pan.js
      - run: node --check shell.js
      - run: node --check pane.js
      - run: node --check cells.js
      - run: node --check experience.js
      - run: node --check clipboard-coordinator.js
      - run: node --check library-editing.js
      - run: node --check library-spatial.js
      - run: node --check library-folders.js
      - run: node --check import-session.js
      - run: node --check document-loading.js
      - run: node --check library-transfer.js
      - run: node --check board-lifecycle.js
      - run: node --check recovery.js
      - run: node --check explorer-navigation.js
      - run: node --check library-clipboard.js
      - run: node --check autosize.js
      - run: node --check context-capture.js
      - run: node --check navigation.js
      - run: node --check media-markers.js
      - run: node --check media-controls.js
      - run: node --check workspace-shell.js
      - run: node --check ai-workflow.js
      - run: node --check refinement.js
      - run: node --check appearance.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SUBSET_RESOURCE_PROOF: .ci-proofs/library-subset-resource
          DOCUMENT_TEXT_PROOF: .ci-proofs/document-paragraph-text-resource
          VIDEO_WRITING_PROOF: .ci-proofs/video-writing-reference
          DOCUMENT_TOOL_PROOF: .ci-proofs/document-tool-panels
          DOCUMENT_LIBRARY_PROOF: .ci-proofs/document-library-insert
          DOCUMENT_LIBRARY_GUARD_PROOF: .ci-proofs/document-library-insert-guards
          DOCUMENT_LIBRARY_PIECES_PROOF: .ci-proofs/document-library-pieces
          DOCUMENT_LIBRARY_PIECES_GUARD_PROOF: .ci-proofs/document-library-pieces-guards
          LIBRARY_SPATIAL_PROOF: .ci-proofs/library-spatial-preview
          SEARCH_RETURN_PROOF: .ci-proofs/search-writing-return
          SEARCH_RETURN_GUARDS_PROOF: .ci-proofs/search-writing-return-guards
          LOCAL_START_PROOF: .ci-proofs/local-start-entry
          CANVAS_OUTLINE_PROOF: .ci-proofs/canvas-outline-work
          DOCUMENT_LIBRARY_MULTIPLE_PROOF: .ci-proofs/document-library-multiple
          DOCUMENT_LIBRARY_MULTIPLE_GUARDS_PROOF: .ci-proofs/document-library-multiple-guards
          LIBRARY_RECENT_ORDER_PROOF: .ci-proofs/library-recent-order
          EMPTY_EXAMPLE_PROOF: .ci-proofs/empty-example-entry
          PRESET_UPDATE_PROOF: .ci-proofs/appearance-preset-update
          PORTABILITY_PROOF: .ci-proofs/appearance-portability
          STACKED_SOURCE_PROOF: .ci-proofs/narrow-reference-stack
          PICKED_REVIEW_PROOF: .ci-proofs/library-picked-review
          REUSE_ENTRY_PROOF: .ci-proofs/library-reuse-entry
          PAPER_TOOLS_FOLD_PROOF: .ci-proofs/paper-tools-fold
          LIBRARY_KIND_FILTER_PROOF: .ci-proofs/library-kind-filter
          PAPER_CONTEXT_PROOF: .ci-proofs/paper-edit-context
          PAPER_FIND_PROOF: .ci-proofs/paper-local-find
          PAPER_FIND_GUARDS_PROOF: .ci-proofs/paper-local-find-guards
          COLLECT_REVIEW_PROOF: .ci-proofs/collect-content-review
          HELP_JOURNEY_PROOF: .ci-proofs/help-reuse-journey
      - name: Keep isolated subset-resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subset-resource-${{ github.run_id }}
          path: |
            .ci-proofs/library-subset-resource/result.json
            .ci-proofs/library-subset-resource/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep isolated document-paragraph-text evidence
