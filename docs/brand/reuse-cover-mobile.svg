<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">把这次的创作，用在下一次</title><desc id="desc">创作白板的积累与复用循环。先创作，再把内容与内部连线收进内容库，取出独立副本用于新的白板。流程示意。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222923" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="720" height="1260" fill="#f1f0e8" stroke="none" stroke-width="0"/><rect x="44" y="46" width="27" height="27" fill="#e2ef85" stroke="#222923" stroke-width="2"/><rect x="55" y="35" width="27" height="27" fill="none" stroke="#222923" stroke-width="2"/><text x="100" y="70" font-size="29" fill="#222923" font-weight="700" >创作白板</text><text x="435" y="69" font-size="19" fill="#66705f" font-weight="500" >KEEP / REUSE</text><text x="44" y="184" font-size="63" fill="#222923" font-weight="700" letter-spacing="-2">把这次的创作，</text><rect x="166" y="214" width="187" height="59" fill="#e2ef85" stroke="none" stroke-width="0"/><text x="44" y="267" font-size="63" fill="#222923" font-weight="700" letter-spacing="-2">用在下一次。</text><text x="46" y="330" font-size="28" fill="#596152" font-weight="400" >笔记、素材、表格与组合，</text><text x="46" y="373" font-size="28" fill="#596152" font-weight="400" >存成资源，换张白板继续用。</text><text x="44" y="441" font-size="27" fill="#222923" font-weight="600" >01 / 创作</text><rect x="44" y="464" width="632" height="147" fill="white" stroke="#ccd0c4" stroke-width="1.5"/><rect x="66" y="493" width="180" height="85" fill="#f3c2aa" stroke="#ccd0c4" stroke-width="1.5"/><text x="89" y="548" font-size="30" fill="#222923" font-weight="600" >笔记</text><rect x="270" y="493" width="180" height="85" fill="#cfd5f7" stroke="#ccd0c4" stroke-width="1.5"/><text x="293" y="548" font-size="30" fill="#222923" font-weight="600" >素材</text><rect x="474" y="493" width="180" height="85" fill="#e8ebdf" stroke="#ccd0c4" stroke-width="1.5"/><text x="497" y="548" font-size="30" fill="#222923" font-weight="600" >表格</text><path d="M248 538H267M452 538H471" fill="none" stroke="#222923" stroke-width="2" /><path d="M360 624V660" fill="none" stroke="#222923" stroke-width="3" marker-end="url(#arrow)"/><text x="392" y="649" font-size="24" fill="#596152" font-weight="400" >存成资源</text><rect x="44" y="687" width="632" height="190" fill="#222923" stroke="#222923" stroke-width="1.5"/><text x="68" y="727" font-size="24" fill="#b9c4aa" font-weight="400" >02 / 内容库</text><text x="68" y="787" font-size="45" fill="#f1f0e8" font-weight="700" >我的资源</text><text x="68" y="840" font-size="25" fill="#c0cbb2" font-weight="400" >保留内容，也保留内部连线。</text><g transform="translate(523 746) scale(0.9)"><rect x="8" y="0" width="116" height="70" fill="#fffdf3" stroke="#222923" stroke-width="2"/><rect x="0" y="9" width="116" height="70" fill="#e2ef85" stroke="#222923" stroke-width="2"/><path d="M17 29H89M17 43H75M17 57H95" fill="none" stroke="#222923" stroke-width="3" /></g><path d="M360 891V932" fill="none" stroke="#222923" stroke-width="3" marker-end="url(#arrow)"/><text x="392" y="919" font-size="24" fill="#596152" font-weight="400" >取出副本</text><text x="44" y="980" font-size="27" fill="#222923" font-weight="600" >03 / 复用</text><rect x="44" y="1003" width="300" height="141" fill="white" stroke="#ccd0c4" stroke-width="1.5"/><text x="64" y="1043" font-size="25" fill="#222923" font-weight="600" >新白板 A</text><rect x="64" y="1062" width="98" height="56" fill="#cfd5f7" stroke="#ccd0c4" stroke-width="1.5"/><g transform="translate(218 1058) scale(0.65)"><rect x="8" y="0" width="116" height="70" fill="#fffdf3" stroke="#222923" stroke-width="2"/><rect x="0" y="9" width="116" height="70" fill="#e2ef85" stroke="#222923" stroke-width="2"/><path d="M17 29H89M17 43H75M17 57H95" fill="none" stroke="#222923" stroke-width="3" /></g><rect x="376" y="1003" width="300" height="141" fill="white" stroke="#ccd0c4" stroke-width="1.5"/><text x="396" y="1043" font-size="25" fill="#222923" font-weight="600" >新白板 B</text><rect x="396" y="1062" width="98" height="56" fill="#cfd5f7" stroke="#ccd0c4" stroke-width="1.5"/><g transform="translate(550 1058) scale(0.65)"><rect x="8" y="0" width="116" height="70" fill="#fffdf3" stroke="#222923" stroke-width="2"/><rect x="0" y="9" width="116" height="70" fill="#e2ef85" stroke="#222923" stroke-width="2"/><path d="M17 29H89M17 43H75M17 57H95" fill="none" stroke="#222923" stroke-width="3" /></g><path d="M44 1176H676" fill="none" stroke="#ccd0c4" stroke-width="1.5" /><text x="44" y="1221" font-size="27" fill="#222923" font-weight="600" >原件保留 · 副本独立编辑</text></g></svg>